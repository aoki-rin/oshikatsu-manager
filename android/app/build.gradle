apply plugin: 'com.android.application'

// 本机用 gitignored keystore.properties；发布 CI 通过环境变量注入。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValues = [
    storeFile: System.getenv('ANDROID_KEYSTORE_PATH') ?: keystoreProperties['storeFile'],
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword'],
    keyAlias: System.getenv('ANDROID_KEY_ALIAS') ?: keystoreProperties['keyAlias'],
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD') ?: keystoreProperties['keyPassword'],
]
def hasReleaseSigning = signingValues.values().every { it != null && !it.toString().trim().isEmpty() }

android {
    namespace = "com.aoki.oshikatsumgr"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aoki.oshikatsumgr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Never produce a misleading unsigned "release" APK. Debug builds need no keys.
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException('Release signing is missing. See docs/BUILDING.md; use assembleDebug for local development.')
            }
        }
    }
}

// Dependency inventory for the license file distributed beside the APK.
tasks.register('exportReleaseDependencies') {
    doLast {
        // Local Capacitor projects are already covered by their npm licenses.
        def artifacts = configurations.releaseRuntimeClasspath.incoming.artifactView {
            componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        }.artifacts.artifacts
        def entries = artifacts.collect { artifact ->
            [name: artifact.id.componentIdentifier.displayName, file: artifact.file.absolutePath]
        }.sort { it.name }
        def destination = layout.buildDirectory.file('release-dependencies.json').get().asFile
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries))
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Chromium 网络栈：Akamai 按 TLS 指纹判客户端,OkHttp 被静默丢弃而 Chromium 通过。
    // 用 Play Services 版(而非 cronet-embedded)：体积几乎为零,自用 Pixel 有 GMS。见 docs/adr/0005。
    implementation "com.google.android.gms:play-services-cronet:18.1.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
