<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 核心质感渐变 -->
    <linearGradient id="corePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A7A" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E91E63" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF4081" stop-opacity="0.05"/>
    </linearGradient>
    <!-- 极客风格点阵网格 -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.04)" />
    </pattern>
  </defs>

  <!-- 1. 基础深色背景 (深邃几黑暗底) -->
  <rect width="512" height="512" rx="112" fill="#121212" />
  
  <!-- 2. 点阵阵列微弱纹理层 -->
  <rect width="512" height="512" rx="112" fill="url(#dotGrid)" />

  <!-- 3. 背景几何轨道装饰元素 -->
  <!-- 左上角主推色偏心光环 -->
  <circle cx="120" cy="80" r="180" fill="none" stroke="url(#ringGradient)" stroke-width="12" />
  <!-- 右下角科技虚线环 -->
  <circle cx="420" cy="420" r="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="16" stroke-dasharray="24, 24" />
  <!-- 中心向外延伸的辅助标线 -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2" />

  <!-- 4. 中心高优"推し活"核心模块 -->
  <rect x="180" y="180" width="152" height="152" rx="36" fill="url(#corePink)" />
  <!-- 发光内描边提升立体感 -->
  <rect x="180" y="180" width="152" height="152" rx="36" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  
  <!-- 5. 核心文字字符（推） -->
  <text x="256" y="296" font-family="'SF Pro Display', 'Inter', 'Noto Sans JP', sans-serif" font-weight="900" font-size="108" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">推</text>
</svg>