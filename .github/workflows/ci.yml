name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tsc + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test
