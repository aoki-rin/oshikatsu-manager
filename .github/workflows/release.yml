name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'aoki-rin/oshikatsu-manager' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:version
      - name: Check release notes
        run: test -s "docs/releases/$RELEASE_TAG.md"
      - run: npm run lint
      - run: npm run test:cov
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:release
      - run: npx cap sync android
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/oshikatsu-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release secret: $name"
              exit 1
            fi
          done
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          cd android
          ./gradlew assembleRelease exportReleaseDependencies --no-daemon
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/oshikatsu-manager.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/oshikatsu-manager.apk
      - name: Collect third-party licenses and checksums
        run: |
          node scripts/collect-licenses.mjs
          cd release
          sha256sum oshikatsu-manager.apk THIRD_PARTY_LICENSES.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/oshikatsu-manager.apk release/THIRD_PARTY_LICENSES.txt release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "推し活マネージャー $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
